name: Treino corpus misto contrastivo 2026-10-11

on:
  push:
    branches:
      - codex/corpus-misto-contrastivo-20261011
    paths:
      - 'experimentos/corpus_misto_contrastivo_20261011/treinar_e_avaliar.py'
      - '.github/workflows/treino-corpus-misto-contrastivo-20261011.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  treino-misto:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ambiente numérico
        run: python -m pip install 'numpy==2.3.5'
      - name: Compilar experimento
        run: python -m py_compile experimentos/corpus_misto_contrastivo_20261011/treinar_e_avaliar.py
      - name: Treinar candidato único e avaliar prospectivo
        run: python experimentos/corpus_misto_contrastivo_20261011/treinar_e_avaliar.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treino-corpus-misto-contrastivo-20261011
          path: |
            experimentos/corpus_misto_contrastivo_20261011/resultados_treino.json
            experimentos/corpus_misto_contrastivo_20261011/RELATORIO_TREINO.md
            experimentos/corpus_misto_contrastivo_20261011/checkpoint_misto.json.gz
          if-no-files-found: warn
      - name: Preservar resultado experimental
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            experimentos/corpus_misto_contrastivo_20261011/resultados_treino.json \
            experimentos/corpus_misto_contrastivo_20261011/RELATORIO_TREINO.md \
            experimentos/corpus_misto_contrastivo_20261011/checkpoint_misto.json.gz
          if git diff --cached --quiet; then
            echo 'Sem resultado novo.'
          else
            git commit -m 'Registra resultado do treino misto contrastivo'
            git push
          fi
