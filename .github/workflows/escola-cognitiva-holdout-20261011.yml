name: Escola Cognitiva - congelar prova 2026-10-11

on:
  push:
    branches:
      - codex/escola-cognitiva-fatorada-20261011
    paths:
      - 'experimentos/escola_cognitiva_20261011/escola.py'
      - 'experimentos/escola_cognitiva_20261011/protocolo.json'
      - 'experimentos/escola_cognitiva_20261011/preparar_holdout.py'
      - '.github/workflows/escola-cognitiva-holdout-20261011.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  congelar-prova:
    runs-on: ubuntu-22.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ambiente numerico
        run: python -m pip install 'numpy==2.3.5'
      - name: Compilar escola e gerador
        run: python -m py_compile experimentos/escola_cognitiva_20261011/escola.py experimentos/escola_cognitiva_20261011/preparar_holdout.py
      - name: Validar professores e congelar prova sem treino
        run: python experimentos/escola_cognitiva_20261011/preparar_holdout.py
      - name: Preservar prova congelada na branch
        run: |
          git config user.name 'Henry Tools'
          git config user.email 'zerobob623@gmail.com'
          git add experimentos/escola_cognitiva_20261011/holdout_escola.json experimentos/escola_cognitiva_20261011/manifesto_holdout.json
          if git diff --cached --quiet; then
            echo 'Prova ja preservada; nada a gravar.'
          else
            git commit -m 'Congela primeira prova da Escola Cognitiva'
            git push
          fi
