name: Análise de conteúdo enviado
concurrency:
  group: dominio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    paths:
      - 'analise_conteudo.py'
      - 'correcao_texto.py'
      - 'testes_analise_conteudo.py'
      - 'testes_correcao_texto.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conteudo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Prioridades de conversa e revisão lógica
        run: python -m unittest testes_ampliacao.TestesAmpliacao.test_contratos_fixados_antes_dos_novos_pesos testes_integracao_raciocinio_ativo -v
      - run: python -m unittest testes_correcao_texto testes_analise_conteudo testes_compreensao_textual testes_web testes_http_chunked testes_memoria_navegador testes_ecossistema -v
      - run: python -S -m unittest testes_correcao_texto testes_analise_conteudo -v
      - run: node --check public/app.js
