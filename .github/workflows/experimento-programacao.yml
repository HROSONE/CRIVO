name: Experimento adversarial de programação
concurrency:
  group: dominio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    paths:
      - 'experimento_programacao_adversarial.py'
      - 'conversa_assistente.py'
      - 'testes_autoconversa.py'
      - 'testes_conversa_informal.py'
      - 'interpretacao_pedidos.py'
      - 'testes_interpretacao_pedidos.py'
      - 'conhecimento_expandido.json'
      - 'testes_composicao_textual.py'
  workflow_dispatch:
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rodar sonda sem alterar código de produção
        run: |
          set -o pipefail
          python experimento_programacao_adversarial.py | tee resultado-programacao.json
      - name: Publicar relatório de casos e falhas
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-programacao-adversarial
          path: resultado-programacao.json
