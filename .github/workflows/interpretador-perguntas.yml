name: Interpretador de perguntas
on:
  pull_request:
    paths:
      - 'interpretador_perguntas.py'
      - 'crivo.py'
      - 'linguagem_conversa.py'
      - 'web_core.py'
      - 'testes_interpretador_perguntas.py'
      - 'scripts/avaliar_interpretador.py'
      - 'avaliacoes/interpretador_v1/**'
      - '.github/workflows/interpretador-perguntas.yml'
      - 'scripts/executar_testes_ci.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integracao:
    runs-on: ubuntu-22.04
    # Inclui geração própria em 977 conceitos/2.439 nomes e duas avaliações.
    # A matriz de pares e aliases medida em CPU supera o orçamento antigo.
    timeout-minutes: 150
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        grupo: [composicao, regressoes-a, regressoes-b, diagnostico]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'numpy>=1.24,<3'
      - name: Alvos inéditos, ambiguidades, contexto, conversa e HTTP
        if: matrix.grupo != 'diagnostico'
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python scripts/executar_testes_ci.py --grupo '${{ matrix.grupo }}' --modulos testes_interpretador_perguntas testes_linguagem_neural testes_linguagem_conversa testes_interpretacao_pedidos testes_interpretacao_geral testes_conversa_nocoes testes_web testes_crise testes_motor_programacao_chat testes_http_chunked testes_composicao_textual testes_conversa_estudo testes_intencao_definicao
      - name: Interpretador sem dependências opcionais
        if: matrix.grupo == 'diagnostico'
        run: python -S -m unittest testes_interpretador_perguntas -v
      - name: Diagnóstico agregado dos conjuntos congelados
        if: matrix.grupo == 'diagnostico'
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python scripts/avaliar_interpretador.py todos --saida /tmp/interpretador-ativo.json
          python scripts/avaliar_interpretador.py todos --sem-interpretador --saida /tmp/interpretador-base.json
      - uses: actions/upload-artifact@v4
        if: always() && matrix.grupo == 'diagnostico'
        with:
          name: diagnostico-interpretador
          path: /tmp/interpretador-*.json
