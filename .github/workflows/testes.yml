name: Testes Crivo
concurrency:
  group: testes-crivo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, melhorias-crivo-v02]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Comparacao neural opcional (as regressoes sempre executam)'
        type: choice
        options: [nenhum, portugues, historico, ordem]
        default: nenhum
jobs:
  compreensao-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar função, contexto, comparação, fontes e contrato HTTP
        run: python -m unittest testes_funcoes_contextuais testes_busca_factual testes_web -v
  matematica-linguagem-profunda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'tokenizers>=0.20,<1' 'numpy>=1.24,<3'
      - name: Verificar causalidade, perdas por resposta e retomada exata
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m unittest testes_linguagem_profunda testes_backup_treino_drive testes_dialogo_integro testes_compreensao_contrastiva testes_transformer_16m testes_conversa_gerativa testes_dialogos_amplos testes_gerador_frases testes_codigo_real testes_logica_programacao -v
  matematica-geracao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3'
      - name: Conferir BPTT, aprendizado e paridade de inferência
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m unittest testes_geracao testes_intencao_gerativa testes_compreensao testes_seq2seq testes_treino_numpy -v
  testes:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    # 20 min até 2026-10-03; o currículo passou de 241 para 447 conceitos e
    # testes que crescem com o acervo (treino com todas as classes, matriz de
    # pares de conceitos) levam o job de 3.8/3.11 para além disso. Com o
    # acervo de 2026-10-05 (544 conceitos) o 3.8, mais lento, passou de 35 min
    # também no main; 3.11 e 3.13 terminam em ~26 min. Com o acervo profundo
    # de 2026-10-06 (680 conceitos, 3.947 fatos) o 3.11 levou 43 min e o 3.8
    # passou de 50. Com as lacunas de 2026-10-07 (949 conceitos, ~5.200 fatos)
    # o 3.13 levou 47 min e o 3.8/3.11 passaram de 75.
    timeout-minutes: 120
    strategy:
      matrix:
        python-version: ['3.8', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar aceleração declarada pelo projeto
        run: python -m pip install -r requirements.txt
      - name: Compilar
        run: python -m compileall -q .
      - name: Testes originais
        run: python crivo.py --teste
      - name: Testes novos
        run: python -m unittest discover -p 'testes*.py' -v
      - name: Sondas de conversacao e conhecimento cientifico
        if: matrix.python-version == '3.11'
        run: |
          python avaliar_conversacao.py
          python avaliar_mundo.py
          python avaliar_bate_papo.py --saida /tmp/bate-papo.json
          python avaliar_geracao.py --saida /tmp/geracao.json
          python avaliar_ampliacao.py --saida /tmp/ampliacao.json
      - name: Avaliar familias de validacao reservadas
        if: matrix.python-version == '3.11'
        run: python avaliar_generalizacao.py --split validacao --saida /tmp/generalizacao.json
      - name: Avaliar extracao e retomadas (desenvolvimento)
        if: matrix.python-version == '3.11'
        run: python avaliar_retomada.py --saida /tmp/retomada.json
      - name: Avaliar planejamento, evidencias e dialogo integrado
        if: matrix.python-version == '3.11'
        run: python avaliar_evolucao_integrada.py --saida /tmp/evolucao-integrada.json
      - name: Diagnosticar Astronomia v1 congelada (sem promover certificacao)
        if: matrix.python-version == '3.11'
        run: |
          python scripts/avaliar_astronomia_independente.py > /tmp/astronomia-v1-saida.txt 2>&1 && echo 'Sonda passou' || echo 'Sonda nao atingiu gate; consultar artefato'
          cat /tmp/astronomia-v1-saida.txt
      - name: Publicar diagnostico de Astronomia
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-astronomia-modulo1
          path: |
            resultado_astronomia_independente_v1.json
            /tmp/astronomia-v1-saida.txt
          if-no-files-found: error
      - name: Publicar resultado de validacao
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: generalizacao-validacao
          path: |
            /tmp/generalizacao.json
            /tmp/retomada.json
            /tmp/bate-papo.json
            /tmp/geracao.json
            /tmp/ampliacao.json
            /tmp/evolucao-integrada.json
      - name: Medir generalizacao (amostra de 8 epocas)
        if: matrix.python-version == '3.11' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'historico'
        run: |
          python avaliar_rede.py --epocas 8
          python avaliar_rede.py --epocas 30
          python avaliar_rede.py --epocas 60
          python avaliar_rede.py --epocas 60 --ocultos 48
      - name: Validacao cruzada de todas as perguntas
        if: matrix.python-version == '3.11' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'historico'
        run: |
          python avaliar_rede.py --cruzada --epocas 8
          python avaliar_rede.py --cruzada --epocas 30
          python avaliar_rede.py --cruzada --epocas 60
          python avaliar_rede.py --cruzada --epocas 60 --ocultos 48
      - name: Comparar representacoes de portugues
        if: matrix.python-version == '3.11' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'historico'
        run: |
          python avaliar_rede.py --cruzada --epocas 30 --modo palavras
          python avaliar_rede.py --cruzada --epocas 30 --modo misto
          python avaliar_rede.py --cruzada --epocas 30 --modo misto --dimensao 512
      - name: Comparar treinamento e largura da rede mista de 512 dimensoes
        if: matrix.python-version == '3.11' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'historico'
        run: |
          python avaliar_rede.py --cruzada --epocas 60 --modo misto --dimensao 512
          python avaliar_rede.py --cruzada --epocas 60 --ocultos 48 --modo misto --dimensao 512
      - name: Comparar normalizacao linguistica em execucao sob demanda
        if: matrix.python-version == '3.11' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'portugues'
        run: |
          python avaliar_rede.py --cruzada --epocas 30 --modo portugues --dimensao 512
          python avaliar_rede.py --cruzada --epocas 30 --modo portugues_sem_filtro --dimensao 512
          python avaliar_rede.py --cruzada --epocas 60 --ocultos 48 --modo portugues --dimensao 512
          python avaliar_rede.py --cruzada --epocas 60 --ocultos 48 --modo portugues_sem_filtro --dimensao 512
          python avaliar_rede.py --cruzada --epocas 30 --modo misto --dimensao 512
          python avaliar_rede.py --cruzada --epocas 60 --ocultos 48 --modo misto --dimensao 512

      - name: Comparar ordem de palavras em dobras iguais
        if: matrix.python-version == '3.11' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'ordem'
        run: |
          python comparar_ordem.py --epocas 30 --ocultos 24 --dimensao 512 --peso-ordem 0.05
          python comparar_ordem.py --epocas 30 --ocultos 24 --dimensao 512 --peso-ordem 0.15
          python comparar_ordem.py --epocas 30 --ocultos 24 --dimensao 512 --peso-ordem 0.35
