name: Testes Crivo
concurrency:
  group: testes-crivo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches: [main, melhorias-crivo-v02]
  pull_request:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Comparacao neural opcional (as regressoes sempre executam)'
        type: choice
        options: [nenhum, portugues, historico, ordem]
        default: nenhum
      grupos:
        description: 'Baterias completas: todas ou somente composição e regressões-b'
        type: choice
        options: [todos, composicao-regressoes-b]
        default: todos
permissions:
  contents: read
jobs:
  configuracao-ci:
    outputs:
      geracao: ${{ steps.escopo.outputs.geracao }}
      profunda: ${{ steps.escopo.outputs.profunda }}
      grupos: ${{ steps.escopo.outputs.grupos }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML==6.0.3'
      - id: escopo
        run: python scripts/verificar_workflows_ci.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Validar sintaxe, expressões e dependências dos jobs
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes=
  roteamento-natural:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Conferir fontes e impedir entrega de outro domínio
        run: python -m unittest testes_roteamento_natural testes_roteamento_natural_v2 testes_conversa_dialogo testes_dialogo_v2 -v
      - name: Reproduzir os 35 casos reais congelados pelo adaptador HTTP
        run: python experimentos/roteamento_natural_v2_20261009/avaliar.py --saida /tmp/roteamento-natural.json --exigir-meta
      - name: Verificar diálogo integrado nos 43 casos congelados por HTTP real
        run: python experimentos/dialogo_v2_20261010/avaliar.py --modo http --so-congelado --saida /tmp/dialogo-integrado.json --exigir-meta
  verificacao-pos-merge:
    # O PR executa roteamento e contratos essenciais. O push na main verifica
    # somente se o código integrado ainda inicia e atende ao contrato HTTP.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Compilar o código integrado
        run: python -m compileall -q .
      - name: Conferir funcionamento, memória, fatos e HTTP
        run: |
          python -m unittest \
            testes_web.TestesWebCore.test_reconstroi_contexto_em_vez_de_salvar_no_servidor \
            testes_web.TestesWebCore.test_conhecimento_e_provas_de_fatos \
            testes_web.TestesWebHTTP.test_home_assets_and_health \
            testes_web.TestesWebHTTP.test_http_post_retorna_resposta_real \
            testes_memoria_sessao.TestesMemoriaSessao.test_copia_isolamento_reinicio_e_mudanca_de_tema -v
  compreensao-chat:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exercitar também o gerador próprio ativo
        run: python -m pip install -r requirements.txt
      - name: Verificar função, contexto, comparação, fontes e contrato HTTP
        run: python -m unittest testes_autoconversa testes_funcoes_contextuais.TestesFuncoesContextuais.test_comparacao_preserva_antecedente_e_fontes testes_funcoes_contextuais.TestesFuncoesContextuais.test_api_reconstroi_funcao_e_troca_sujeito testes_busca_factual.TestesBuscaFactual.test_resposta_aproximada_de_outro_assunto_nao_vence testes_web.TestesWebCore testes_web.TestesWebHTTP testes_web.TestesCorpoServerless testes_geracao_ancorada testes_integracao_raciocinio_ativo testes_motor_programacao_chat testes_hipoteses_confirmadas -v
  matematica-linguagem-profunda:
    needs: configuracao-ci
    if: (github.event_name == 'workflow_dispatch' && inputs.grupos != 'composicao-regressoes-b') || github.event_name == 'schedule' || (github.event_name == 'pull_request' && needs.configuracao-ci.outputs.profunda == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'tokenizers>=0.20,<1' 'numpy>=1.24,<3'
      - name: Verificar causalidade, perdas por resposta e retomada exata
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m unittest testes_linguagem_profunda testes_backup_treino_drive testes_dialogo_integro testes_compreensao_contrastiva testes_transformer_16m testes_conversa_gerativa testes_dialogos_amplos testes_gerador_frases testes_codigo_real testes_logica_programacao -v
  matematica-geracao:
    needs: configuracao-ci
    if: (github.event_name == 'workflow_dispatch' && inputs.grupos != 'composicao-regressoes-b') || github.event_name == 'schedule' || (github.event_name == 'pull_request' && needs.configuracao-ci.outputs.geracao == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3'
      - name: Conferir BPTT, aprendizado e paridade de inferência
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m unittest testes_geracao testes_intencao_gerativa testes_compreensao testes_seq2seq testes_treino_numpy -v
  testes:
    needs: configuracao-ci
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    # 20 min até 2026-10-03; o currículo passou de 241 para 447 conceitos e
    # testes que crescem com o acervo (treino com todas as classes, matriz de
    # pares de conceitos) levam o job de 3.8/3.11 para além disso. Com o
    # acervo de 2026-10-05 (544 conceitos) o 3.8, mais lento, passou de 35 min
    # também no main; 3.11 e 3.13 terminam em ~26 min. Com o acervo profundo
    # de 2026-10-06 (680 conceitos, 3.947 fatos) o 3.11 levou 43 min e o 3.8
    # passou de 50. Com as lacunas de 2026-10-07 (949 conceitos, ~5.200 fatos)
    # o 3.13 levou 47 min e o 3.8/3.11 passaram de 75.
    # Com NumPy, a suíte também executa o gerador próprio: só a matriz
    # de pares e os 2.439 nomes/aliases somam mais de uma hora em CPU.
    # Mantemos todos os testes e orçamento para a validação completa.
    # A descoberta completa agora roda em quatro grupos por versão, com
    # composição e treino isolados. Uma falha não cancela os demais grupos.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11', '3.13']
        grupo: ${{ fromJSON(needs.configuracao-ci.outputs.grupos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar aceleração declarada pelo projeto
        run: python -m pip install -r requirements.txt
      - name: Compilar
        run: python -m compileall -q .
      - name: Verificar compatibilidade dos testes bíblicos antes da suíte longa
        run: python -m unittest testes_biblia -v
      - name: Testes originais
        run: python crivo.py --teste
      - name: Testes novos
        run: python scripts/executar_testes_ci.py --grupo '${{ matrix.grupo }}'
      - name: Sondas de conversacao e conhecimento cientifico
        if: matrix.python-version == '3.11' && matrix.grupo == 'regressoes-a'
        run: |
          python avaliar_conversacao.py
          python avaliar_mundo.py
          python avaliar_bate_papo.py --saida /tmp/bate-papo.json
          python avaliar_geracao.py --saida /tmp/geracao.json
          python avaliar_ampliacao.py --saida /tmp/ampliacao.json
      - name: Avaliar familias de validacao reservadas
        if: matrix.python-version == '3.11' && matrix.grupo == 'regressoes-a'
        run: python avaliar_generalizacao.py --split validacao --saida /tmp/generalizacao.json
      - name: Avaliar extracao e retomadas (desenvolvimento)
        if: matrix.python-version == '3.11' && matrix.grupo == 'regressoes-a'
        run: python avaliar_retomada.py --saida /tmp/retomada.json
      - name: Avaliar planejamento, evidencias e dialogo integrado
        if: matrix.python-version == '3.11' && matrix.grupo == 'regressoes-a'
        run: python avaliar_evolucao_integrada.py --saida /tmp/evolucao-integrada.json
      - name: Diagnosticar Astronomia v1 congelada (sem promover certificacao)
        if: matrix.python-version == '3.11' && matrix.grupo == 'regressoes-a'
        run: |
          python scripts/avaliar_astronomia_independente.py > /tmp/astronomia-v1-saida.txt 2>&1 && echo 'Sonda passou' || echo 'Sonda nao atingiu gate; consultar artefato'
          cat /tmp/astronomia-v1-saida.txt
      - name: Publicar diagnostico de Astronomia
        if: matrix.python-version == '3.11' && matrix.grupo == 'regressoes-a'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-astronomia-modulo1
          path: |
            resultado_astronomia_independente_v1.json
            /tmp/astronomia-v1-saida.txt
          retention-days: 7
          if-no-files-found: error
      - name: Publicar resultado de validacao
        if: matrix.python-version == '3.11' && matrix.grupo == 'regressoes-a'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: generalizacao-validacao
          path: |
            /tmp/generalizacao.json
            /tmp/retomada.json
            /tmp/bate-papo.json
            /tmp/geracao.json
            /tmp/ampliacao.json
            /tmp/evolucao-integrada.json
      - name: Medir generalizacao (amostra de 8 epocas)
        if: matrix.python-version == '3.11' && matrix.grupo == 'regressoes-a' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'historico'
        run: |
          python avaliar_rede.py --epocas 8
          python avaliar_rede.py --epocas 30
          python avaliar_rede.py --epocas 60
          python avaliar_rede.py --epocas 60 --ocultos 48
      - name: Validacao cruzada de todas as perguntas
        if: matrix.python-version == '3.11' && matrix.grupo == 'regressoes-a' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'historico'
        run: |
          python avaliar_rede.py --cruzada --epocas 8
          python avaliar_rede.py --cruzada --epocas 30
          python avaliar_rede.py --cruzada --epocas 60
          python avaliar_rede.py --cruzada --epocas 60 --ocultos 48
      - name: Comparar representacoes de portugues
        if: matrix.python-version == '3.11' && matrix.grupo == 'regressoes-a' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'historico'
        run: |
          python avaliar_rede.py --cruzada --epocas 30 --modo palavras
          python avaliar_rede.py --cruzada --epocas 30 --modo misto
          python avaliar_rede.py --cruzada --epocas 30 --modo misto --dimensao 512
      - name: Comparar treinamento e largura da rede mista de 512 dimensoes
        if: matrix.python-version == '3.11' && matrix.grupo == 'regressoes-a' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'historico'
        run: |
          python avaliar_rede.py --cruzada --epocas 60 --modo misto --dimensao 512
          python avaliar_rede.py --cruzada --epocas 60 --ocultos 48 --modo misto --dimensao 512
      - name: Comparar normalizacao linguistica em execucao sob demanda
        if: matrix.python-version == '3.11' && matrix.grupo == 'regressoes-a' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'portugues'
        run: |
          python avaliar_rede.py --cruzada --epocas 30 --modo portugues --dimensao 512
          python avaliar_rede.py --cruzada --epocas 30 --modo portugues_sem_filtro --dimensao 512
          python avaliar_rede.py --cruzada --epocas 60 --ocultos 48 --modo portugues --dimensao 512
          python avaliar_rede.py --cruzada --epocas 60 --ocultos 48 --modo portugues_sem_filtro --dimensao 512
          python avaliar_rede.py --cruzada --epocas 30 --modo misto --dimensao 512
          python avaliar_rede.py --cruzada --epocas 60 --ocultos 48 --modo misto --dimensao 512

      - name: Comparar ordem de palavras em dobras iguais
        if: matrix.python-version == '3.11' && matrix.grupo == 'regressoes-a' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'ordem'
        run: |
          python comparar_ordem.py --epocas 30 --ocultos 24 --dimensao 512 --peso-ordem 0.05
          python comparar_ordem.py --epocas 30 --ocultos 24 --dimensao 512 --peso-ordem 0.15
          python comparar_ordem.py --epocas 30 --ocultos 24 --dimensao 512 --peso-ordem 0.35
