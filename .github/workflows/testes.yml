name: Testes Crivo
on:
  push:
    branches: [main, melhorias-crivo-v02]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Comparacao neural opcional (as regressoes sempre executam)'
        type: choice
        options: [nenhum, portugues, historico]
        default: nenhum
jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar
        run: python -m compileall -q .
      - name: Testes originais
        run: python crivo.py --teste
      - name: Testes novos
        run: python -m unittest discover -p 'testes*.py' -v
      - name: Sondas de conversacao e conhecimento cientifico
        if: matrix.python-version == '3.11'
        run: |
          python avaliar_conversacao.py
          python avaliar_mundo.py
          python avaliar_bate_papo.py --saida /tmp/bate-papo.json
      - name: Avaliar familias de validacao reservadas
        if: matrix.python-version == '3.11'
        run: python avaliar_generalizacao.py --split validacao --saida /tmp/generalizacao.json
      - name: Avaliar extracao e retomadas (desenvolvimento)
        if: matrix.python-version == '3.11'
        run: python avaliar_retomada.py --saida /tmp/retomada.json
      - name: Avaliar planejamento, evidencias e dialogo integrado
        if: matrix.python-version == '3.11'
        run: python avaliar_evolucao_integrada.py --saida /tmp/evolucao-integrada.json
      - name: Publicar resultado de validacao
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: generalizacao-validacao
          path: |
            /tmp/generalizacao.json
            /tmp/retomada.json
            /tmp/bate-papo.json
            /tmp/evolucao-integrada.json
      - name: Medir generalizacao (amostra de 8 epocas)
        if: matrix.python-version == '3.11' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'historico'
        run: |
          python avaliar_rede.py --epocas 8
          python avaliar_rede.py --epocas 30
          python avaliar_rede.py --epocas 60
          python avaliar_rede.py --epocas 60 --ocultos 48
      - name: Validacao cruzada de todas as perguntas
        if: matrix.python-version == '3.11' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'historico'
        run: |
          python avaliar_rede.py --cruzada --epocas 8
          python avaliar_rede.py --cruzada --epocas 30
          python avaliar_rede.py --cruzada --epocas 60
          python avaliar_rede.py --cruzada --epocas 60 --ocultos 48
      - name: Comparar representacoes de portugues
        if: matrix.python-version == '3.11' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'historico'
        run: |
          python avaliar_rede.py --cruzada --epocas 30 --modo palavras
          python avaliar_rede.py --cruzada --epocas 30 --modo misto
          python avaliar_rede.py --cruzada --epocas 30 --modo misto --dimensao 512
      - name: Comparar treinamento e largura da rede mista de 512 dimensoes
        if: matrix.python-version == '3.11' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'historico'
        run: |
          python avaliar_rede.py --cruzada --epocas 60 --modo misto --dimensao 512
          python avaliar_rede.py --cruzada --epocas 60 --ocultos 48 --modo misto --dimensao 512
      - name: Comparar normalizacao linguistica em execucao sob demanda
        if: matrix.python-version == '3.11' && github.event_name == 'workflow_dispatch' && inputs.benchmark == 'portugues'
        run: |
          python avaliar_rede.py --cruzada --epocas 30 --modo portugues --dimensao 512
          python avaliar_rede.py --cruzada --epocas 30 --modo portugues_sem_filtro --dimensao 512
          python avaliar_rede.py --cruzada --epocas 60 --ocultos 48 --modo portugues --dimensao 512
          python avaliar_rede.py --cruzada --epocas 60 --ocultos 48 --modo portugues_sem_filtro --dimensao 512
          python avaliar_rede.py --cruzada --epocas 30 --modo misto --dimensao 512
          python avaliar_rede.py --cruzada --epocas 60 --ocultos 48 --modo misto --dimensao 512
