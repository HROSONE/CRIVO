name: Escola Transformer 17M - Pointer V3

on:
  pull_request:
    paths:
      - 'experimentos/escola_transformer_17m_pointer_v3_20261011/**'
      - '.github/workflows/escola-transformer17m-pointer-v3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  congelamento:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Conferir holdout e protocolo congelados
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json
          from pathlib import Path
          p=Path('experimentos/escola_transformer_17m_pointer_v3_20261011')
          man=json.loads((p/'manifesto_holdout.json').read_text(encoding='utf-8'))
          protocolo=json.loads((p/'protocolo.json').read_text(encoding='utf-8'))
          gerador=hashlib.sha256((p/'preparar_holdout.py').read_bytes()).hexdigest()
          spec=importlib.util.spec_from_file_location('holdv3',p/'preparar_holdout.py')
          h=importlib.util.module_from_spec(spec); spec.loader.exec_module(h)
          xs=h.gerar(); por={op:sum(x['operacao']==op for x in xs) for op in h.OPERACOES}
          repetidas=len(xs)-len({x['mensagem'] for x in xs})
          pacote={'versao':3,'semente':h.SEMENTE,'congelado_antes_do_treino':True,
            'auditoria':{'aprovado':True,'exemplos':120,'familias':len(h.FAMILIAS),
                         'mensagens_exatas_repetidas':repetidas,'por_operacao':por},'exemplos':xs}
          hold=hashlib.sha256(json.dumps(pacote,ensure_ascii=False,sort_keys=True,
                 separators=(',',':')).encode()).hexdigest()
          print('gerador',gerador); print('holdout',hold); print('repetidas',repetidas); print('por',por)
          assert gerador==man['gerador_sha256']
          assert hold==man['holdout_sha256_canonico']==protocolo['avaliacao']['holdout_sha256_canonico']
          assert len(xs)==120 and set(por.values())=={20}
          assert repetidas==20
          assert protocolo['origem']['checkpoint_v1_sha256']=='849bc4655820f8cd1f445539a1bd0f01959f03ce38145ece460c0fe27568c661'
          assert protocolo['seguranca']['ativo_no_chat'] is False
          PY
      - name: Compilar treinador e auditar currículo
        run: |
          python -m py_compile \
            experimentos/escola_transformer_17m_pointer_v3_20261011/curriculo_pointer.py \
            experimentos/escola_transformer_17m_pointer_v3_20261011/treinar_pointer.py
          python experimentos/escola_transformer_17m_pointer_v3_20261011/curriculo_pointer.py

  treino-pointer-v3:
    if: github.event_name == 'pull_request'
    needs: congelamento
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar runtime do Transformer
        run: |
          python -m pip install 'numpy>=1.24,<3' 'tokenizers>=0.20,<1'
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Recuperar checkpoint V1 exato
        uses: actions/download-artifact@v4
        with:
          name: escola-transformer-17m-candidato
          path: /tmp/escola17m-v1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38112043184
      - name: Verificar origem V1
        run: |
          test "$(sha256sum /tmp/escola17m-v1/pesos.pt | cut -d' ' -f1)" = "849bc4655820f8cd1f445539a1bd0f01959f03ce38145ece460c0fe27568c661"
          test "$(sha256sum /tmp/escola17m-v1/tokenizer.json | cut -d' ' -f1)" = "6e37a7508def06d31f648a1fb816a67df99e806d450051b611a2406f044dbe7e"
      - name: Ensinar apontamento e binding
        run: |
          python experimentos/escola_transformer_17m_pointer_v3_20261011/treinar_pointer.py \
            --entrada /tmp/escola17m-v1 --saida /tmp/escola17m-pointer-v3 --dispositivo cpu
      - name: Publicar candidato V3 sem ativar runtime
        uses: actions/upload-artifact@v4
        with:
          name: escola-transformer-17m-pointer-v3
          path: /tmp/escola17m-pointer-v3
          retention-days: 7
          if-no-files-found: error
