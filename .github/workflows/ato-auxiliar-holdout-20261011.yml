name: Ato auxiliar - congelar holdout 2026-10-11

on:
  push:
    branches:
      - codex/ato-auxiliar-dialogo-20261011
    paths:
      - 'experimentos/ato_auxiliar_dialogo_20261011/protocolo.json'
      - 'experimentos/ato_auxiliar_dialogo_20261011/preparar_holdout.py'
      - '.github/workflows/ato-auxiliar-holdout-20261011.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  congelar-holdout:
    runs-on: ubuntu-22.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ambiente numerico
        run: python -m pip install 'numpy==2.3.5'
      - name: Compilar gerador
        run: python -m py_compile experimentos/ato_auxiliar_dialogo_20261011/preparar_holdout.py
      - name: Gerar e auditar holdout sem treino
        run: python experimentos/ato_auxiliar_dialogo_20261011/preparar_holdout.py
      - name: Preservar holdout congelado na branch
        run: |
          git config user.name 'Henry Tools'
          git config user.email 'zerobob623@gmail.com'
          git add experimentos/ato_auxiliar_dialogo_20261011/holdout_novo.json experimentos/ato_auxiliar_dialogo_20261011/manifesto_holdout.json
          if git diff --cached --quiet; then
            echo 'Holdout ja preservado; nada a gravar.'
          else
            git commit -m 'Congela holdout prospectivo do treino auxiliar'
            git push
          fi
