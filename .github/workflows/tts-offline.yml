name: TTS offline - contrato isolado
concurrency:
  group: dominio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches: [main]
    paths:
      - "public/tts/**"
      - "tests/tts_offline.test.cjs"
      - ".github/workflows/tts-offline.yml"
  pull_request:
    paths:
      - "public/tts/**"
      - "tests/tts_offline.test.cjs"
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testar seleção sem acesso a serviços externos
        run: node --test tests/tts_offline.test.cjs
