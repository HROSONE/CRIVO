name: Escola Cognitiva - congelar prova de subespacos v2 2026-10-11

on:
  push:
    branches:
      - codex/escola-subespacos-20261011
    paths:
      - 'experimentos/escola_subespacos_20261011/preparar_holdout_v2.py'
      - '.github/workflows/escola-subespacos-holdout-v2-20261011.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  congelar-prova:
    runs-on: ubuntu-22.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ambiente numerico
        run: python -m pip install 'numpy==2.3.5'
      - name: Compilar gerador
        run: python -m py_compile experimentos/escola_subespacos_20261011/preparar_holdout.py experimentos/escola_subespacos_20261011/preparar_holdout_v2.py
      - name: Gerar e auditar prova sem treinador
        working-directory: experimentos/escola_subespacos_20261011
        run: python preparar_holdout_v2.py
      - name: Preservar prova congelada
        run: |
          git config user.name 'Henry Tools'
          git config user.email 'zerobob623@gmail.com'
          git add experimentos/escola_subespacos_20261011/holdout_subespacos.json experimentos/escola_subespacos_20261011/manifesto_holdout.json
          if git diff --cached --quiet; then
            echo 'Prova ja congelada.'
          else
            git commit -m 'Congela prova textual inédita da aula de subespacos'
            git push
          fi
