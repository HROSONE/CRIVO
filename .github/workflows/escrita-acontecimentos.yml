name: Escrita com acontecimentos
on:
  pull_request:
    paths:
      - 'conversa_dialogo.py'
      - 'testes_referentes_escrita.py'
      - 'experimentos/referentes_escrita_20261010/**'
      - 'orientacao_pratica.py'
      - 'dialogo_situado.py'
      - 'testes_contexto_pratico.py'
      - 'experimentos/contexto_pratico_20261010/**'
      - 'experimentos/diversidade_dialogo_20261010/**'
      - 'testes_diversidade_dialogo.py'
      - 'testes_continuidade_causal.py'
      - 'experimentos/continuidade_causal_20261010/**'
      - 'compreensao_intencao.py'
      - 'web_core.py'
      - 'public/app.js'
      - 'rede_dialogo_conversa.json.gz'
      - 'testes_escrita_acontecimentos.py'
      - 'testes_web.py'
      - 'experimentos/escrita_acontecimentos_20261010/**'
      - '.github/workflows/escrita-acontecimentos.yml'
  workflow_dispatch:
concurrency:
  group: escrita-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  contratos-e-congelados:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3'
      - name: Aprovação, papéis, corpus e HTTP
        run: python -m unittest testes_escrita_acontecimentos testes_web testes_contexto_pratico testes_diversidade_dialogo testes_continuidade_causal testes_referentes_escrita -v
      - name: Mesmos 114 casos no chat aprovado
        run: |
          python experimentos/escrita_acontecimentos_20261010/avaliar.py --modo motor --saida /tmp/dialogo-congelado.json --so-congelado --exigir-meta
          python experimentos/diversidade_dialogo_20261010/verificar_114.py --arquivo /tmp/dialogo-congelado.json
      - name: Utilidade prática nos mesmos 40 turnos por HTTP real
        run: |
          python experimentos/contexto_pratico_20261010/sondar.py --modo http --saida /tmp/pratico-http.json
          python experimentos/contexto_pratico_20261010/avaliar.py --arquivo /tmp/pratico-http.json --saida /tmp/pratico-metricas.json --exigir-meta
      - name: Diversidade sem trocar argumentos nos mesmos 48 turnos por HTTP
        run: |
          python experimentos/diversidade_dialogo_20261010/sondar.py --modo http --saida /tmp/diversidade-http.json
          python experimentos/diversidade_dialogo_20261010/avaliar.py --arquivo /tmp/diversidade-http.json --saida /tmp/diversidade-metricas.json --exigir-meta
      - name: Continuidade e esclarecimento nos mesmos 88 turnos por HTTP
        run: |
          python experimentos/continuidade_causal_20261010/sondar.py --modo http --saida /tmp/causal-http.json
          python experimentos/continuidade_causal_20261010/avaliar.py --arquivo /tmp/causal-http.json --saida /tmp/causal-metricas.json --exigir-meta
      - name: Três estados encadeados em conversas de dezoito turnos
        run: |
          python experimentos/continuidade_causal_20261010/sondar.py --modo http --novas --saida /tmp/folego-http.json
          python experimentos/continuidade_causal_20261010/avaliar_folego.py --arquivo /tmp/folego-http.json --saida /tmp/folego-metricas.json --exigir-meta
      - name: Continuação comum usa o mesmo acontecimento em 24 turnos HTTP
        run: |
          python experimentos/continuidade_causal_20261010/sondar.py --modo http --aliases --saida /tmp/aliases-http.json
          python experimentos/continuidade_causal_20261010/avaliar_aliases.py --arquivo /tmp/aliases-http.json --saida /tmp/aliases-metricas.json --exigir-meta
      - name: Referências e correções nos mesmos 52 turnos por HTTP
        run: |
          python experimentos/referentes_escrita_20261010/sondar.py --modo http --saida /tmp/referentes-http.json
          python experimentos/referentes_escrita_20261010/avaliar.py --arquivo /tmp/referentes-http.json --saida /tmp/referentes-metricas.json --exigir-meta
