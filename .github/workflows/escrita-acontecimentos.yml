name: Escrita com acontecimentos
on:
  pull_request:
    paths:
      - 'conversa_dialogo.py'
      - 'compreensao_intencao.py'
      - 'web_core.py'
      - 'public/app.js'
      - 'rede_dialogo_conversa.json.gz'
      - 'testes_escrita_acontecimentos.py'
      - 'testes_web.py'
      - 'experimentos/escrita_acontecimentos_20261010/**'
      - '.github/workflows/escrita-acontecimentos.yml'
  workflow_dispatch:
concurrency:
  group: escrita-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  contratos-e-congelados:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3'
      - name: Aprovação, papéis, corpus e HTTP
        run: python -m unittest testes_escrita_acontecimentos testes_web -v
      - name: Mesmos 114 casos no chat aprovado
        run: python experimentos/escrita_acontecimentos_20261010/avaliar.py --modo motor --saida /tmp/dialogo-congelado.json --so-congelado --exigir-meta
