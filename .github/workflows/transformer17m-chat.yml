name: Transformer 17M no chat
on:
  pull_request:
    paths:
      - 'motor_dialogo_17m.py'
      - 'dialogo_linguagem_profunda.py'
      - 'api/chat.py'
      - 'testes_motor_dialogo_17m.py'
      - '.github/workflows/transformer17m-chat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integracao-transformer17m:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compilar integração
        run: python -m py_compile motor_dialogo_17m.py dialogo_linguagem_profunda.py api/chat.py testes_motor_dialogo_17m.py
      - name: Testar seleção do motor mais forte
        run: python -m unittest testes_motor_dialogo_17m -v
