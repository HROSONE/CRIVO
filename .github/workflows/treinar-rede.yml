name: Treinar cerebro original do Crivo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rede_neural.py'
      - 'conhecimento.json'
      - 'conhecimento_mundo.json'
      - 'curriculo_mundo.py'
      - 'conhecimento_linguagem.json'
      - 'linguagem_conversa.py'
      - 'crivo.py'
      - '.github/workflows/treinar-rede.yml'

permissions:
  contents: read

jobs:
  treinar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar codigo e regressao
        run: |
          python -m compileall -q .
          python crivo.py --teste
          python -m unittest discover -p 'testes*.py' -q
          python avaliar_mundo.py
          python avaliar_conversacao.py
      - name: Treinar rede neural original com todos os exemplos
        run: |
          python rede_neural.py --base conhecimento.json --saida rede_crivo.json --epocas 60 --ocultos 48 --dimensao 512 --modo portugues --semente 42
      - name: Verificar checkpoint carregado no Crivo
        run: |
          python - <<'PY'
          from crivo import Crivo
          from rede_neural import RedeCrivo
          rede = RedeCrivo.carregar("rede_crivo.json")
          bot = Crivo()
          assert set(rede.rotulos) == {e['id'] for e in bot.base}
          assert len(rede.rotulos) == len(bot.base)
          assert bot.rede is not None, bot.erro_rede
          assert bot.erro_rede is None
          assert rede.modo == "portugues"
          assert rede.dimensao == 512 and rede.ocultos == 48
          assert bot.previsao_neural("como regar uma planta") is not None
          print(f"Checkpoint validado: {len(rede.rotulos)} intencoes, pesos de 512x48, modo portugues.")
          print("Aviso: carregar pesos nao garante melhor acuracia no chatbot hibrido.")
          PY
      - name: Verificar conversas com os pesos novos carregados
        run: |
          python -m unittest testes_programacao testes_dialogo testes_conhecimento_mundo testes_linguagem_conversa -q
          python avaliar_mundo.py
          python avaliar_conversacao.py
      - name: Publicar pesos para download
        uses: actions/upload-artifact@v4
        with:
          name: crivo-rede-512d-48n-${{ github.run_number }}
          path: rede_crivo.json
          if-no-files-found: error
          retention-days: 14
