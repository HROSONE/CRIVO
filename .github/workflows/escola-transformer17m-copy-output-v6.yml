name: Escola Transformer 17M - Copy Output V6

on:
  pull_request:
    paths:
      - 'experimentos/escola_transformer_17m_copy_output_v6_20261011/**'
      - '.github/workflows/escola-transformer17m-copy-output-v6.yml'
  workflow_dispatch:

concurrency:
  group: transformer17m-copy-v6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  pre-validacao:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Conferir prova e protocolo V6 pré-comprometidos
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json
          from pathlib import Path
          p=Path('experimentos/escola_transformer_17m_copy_output_v6_20261011')
          man=json.loads((p/'manifesto_holdout.json').read_text(encoding='utf-8'))
          proto=json.loads((p/'protocolo.json').read_text(encoding='utf-8'))
          ger=hashlib.sha256((p/'preparar_holdout.py').read_bytes()).hexdigest()
          assert ger==man['gerador_sha256']=='3f0b230e34424353a999ccce04129227459474bfe7324ec5f61a48ecc14db78b'
          spec=importlib.util.spec_from_file_location('hv6',p/'preparar_holdout.py')
          h=importlib.util.module_from_spec(spec); spec.loader.exec_module(h)
          xs=h.gerar()
          audit={'exemplos':120,'familias':len(h.FAMILIAS),'mensagens_exatas_repetidas':0,
                 'por_operacao':{op:20 for op in h.OPERACOES},
                 'templates_por_operacao':{op:{str(i):5 for i in range(4)} for op in h.OPERACOES}}
          pacote={'versao':6,'semente':h.SEMENTE,'congelado_antes_do_treino':True,
                  'auditoria':audit,'exemplos':xs}
          hold=hashlib.sha256(json.dumps(pacote,ensure_ascii=False,sort_keys=True,
                    separators=(',',':')).encode()).hexdigest()
          assert hold==man['holdout_sha256_canonico']=='e1ab43ecac8133aebaef8491ef45e3d7eb681c18776cdc5650b5eb96f2f198ce'
          assert len(xs)==120 and len({x['mensagem'] for x in xs})==120
          assert proto['intervencao_unica']['transformer_v4_congelado'] is True
          assert proto['intervencao_unica']['ponte_v4_congelada'] is True
          print('holdout V6 congelado',hold)
          PY
      - name: Conferir currículo e compilar V6
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json
          from pathlib import Path
          p=Path('experimentos/escola_transformer_17m_copy_output_v6_20261011/curriculo_copy.py')
          spec=importlib.util.spec_from_file_location('cv6',p)
          c=importlib.util.module_from_spec(spec); spec.loader.exec_module(c)
          xs=c.gerar_treino()
          h=hashlib.sha256(json.dumps(xs,ensure_ascii=False,sort_keys=True,
             separators=(',',':')).encode()).hexdigest()
          assert len(xs)==3072
          assert h=='af19549f4d5935e816db06309180e3819173b83dc56352dddcd148214850a78f',h
          print('currículo V4 preservado',h)
          PY
          python -m py_compile experimentos/escola_transformer_17m_copy_output_v6_20261011/*.py

  treino-copy-v6:
    needs: pre-validacao
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar runtime
        run: |
          python -m pip install 'numpy>=1.24,<3' 'tokenizers>=0.20,<1'
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Baixar V4 congelada
        uses: actions/download-artifact@v4
        with:
          name: escola-transformer-17m-binding-bridge-v4
          path: /tmp/crivo-v4
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38154299065
      - name: Verificar origem V4
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(p):
            h=hashlib.sha256()
            with open(p,'rb') as f:
              for b in iter(lambda:f.read(1<<20),b''): h.update(b)
            return h.hexdigest()
          assert sha('/tmp/crivo-v4/pesos.pt')=='b152e95776919f7f1bcf522f927a0239c869fccc6b385a0af2b52cf2b77db8fb'
          assert sha('/tmp/crivo-v4/ponte_binding.pt')=='1e13a8fd68143f465de510addddb19a6b441a208a80ec3a7b182a3afc5335808'
          assert sha('/tmp/crivo-v4/tokenizer.json')=='6e37a7508def06d31f648a1fb816a67df99e806d450051b611a2406f044dbe7e'
          m=json.loads(Path('/tmp/crivo-v4/meta.json').read_text(encoding='utf-8'))
          assert m['checkpoint_composto_sha256']=='c53981fda15f31fcc22b3355a8eb75551ce85907926960c1776774db0d9f2cda'
          assert m['ativo_no_chat'] is False
          print('V4 congelada e inativa verificada')
          PY
      - name: Treinar somente a cabeça de cópia V6
        run: |
          python experimentos/escola_transformer_17m_copy_output_v6_20261011/treinar_copy_v6.py \
            --entrada /tmp/crivo-v4 --saida /tmp/crivo-copy-v6 --dispositivo cpu
      - name: Publicar candidato V6 sem ativar chat
        uses: actions/upload-artifact@v4
        with:
          name: escola-transformer-17m-copy-output-v6
          path: /tmp/crivo-copy-v6
          retention-days: 7
          if-no-files-found: error
