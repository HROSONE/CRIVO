name: Prepara holdout cruzado 2026-10-10

on:
  push:
    branches:
      - codex/corpus-cruzado-dialogo-20261010
    paths:
      - 'experimentos/corpus_cruzado_20261010/preparar_holdout.py'
      - '.github/workflows/prepara-holdout-cruzado-20261010.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  congelar-holdout:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compilar gerador do holdout
        run: python -m py_compile experimentos/corpus_cruzado_20261010/preparar_holdout.py
      - name: Gerar somente a prova fresca
        run: python experimentos/corpus_cruzado_20261010/preparar_holdout.py
      - name: Congelar arquivo antes do treino
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experimentos/corpus_cruzado_20261010/holdout_fresco.json experimentos/corpus_cruzado_20261010/holdout_fresco_meta.json
          if git diff --cached --quiet; then
            echo 'Holdout já congelado sem mudança.'
          else
            git commit -m 'Congela holdout fresco antes do treino cruzado'
            git push
          fi
