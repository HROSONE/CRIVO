name: Escola Cognitiva - treino fatorado 2026-10-11

on:
  push:
    branches:
      - codex/escola-cognitiva-fatorada-20261011
    paths:
      - 'experimentos/escola_cognitiva_20261011/treinar_escola.py'
      - 'experimentos/escola_cognitiva_20261011/protocolo_treino.json'
      - '.github/workflows/escola-cognitiva-treino-20261011.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  treino-escola:
    runs-on: ubuntu-22.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ambiente numerico
        run: python -m pip install 'numpy==2.3.5'
      - name: Compilar treinador
        run: python -m py_compile experimentos/escola_cognitiva_20261011/treinar_escola.py
      - name: Treinar candidato unico e abrir prova so depois da selecao
        run: python experimentos/escola_cognitiva_20261011/treinar_escola.py
      - name: Preservar artefatos da primeira turma
        uses: actions/upload-artifact@v4
        with:
          name: escola-cognitiva-primeira-turma
          path: |
            experimentos/escola_cognitiva_20261011/RELATORIO.md
            experimentos/escola_cognitiva_20261011/resultados.json
            experimentos/escola_cognitiva_20261011/checkpoint_escola.json.gz
      - name: Gravar resultado na branch
        run: |
          git config user.name 'Henry Tools'
          git config user.email 'zerobob623@gmail.com'
          git add experimentos/escola_cognitiva_20261011/RELATORIO.md experimentos/escola_cognitiva_20261011/resultados.json experimentos/escola_cognitiva_20261011/checkpoint_escola.json.gz
          if git diff --cached --quiet; then
            echo 'Resultado ja preservado; nada a gravar.'
          else
            git commit -m 'Registra primeira turma da Escola Cognitiva'
            git push
          fi
