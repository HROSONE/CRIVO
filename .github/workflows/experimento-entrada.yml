name: Diagnostico entrada do usuario
concurrency:
  group: dominio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    paths:
      - 'experimento_entrada_usuario.py'
      - 'conversa_assistente.py'
      - 'testes_autoconversa.py'
      - 'testes_conversa_informal.py'
      - 'interpretacao_pedidos.py'
      - 'testes_interpretacao_pedidos.py'
      - 'conhecimento_expandido.json'
      - 'testes_composicao_textual.py'
  workflow_dispatch:
jobs:
  avaliar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Executar cenarios e protecao do benchmark historico
        run: |
          set -o pipefail
          python experimento_entrada_usuario.py | tee relatorio-entrada.json
      - name: Publicar diagnostico completo
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-entrada-usuario
          path: relatorio-entrada.json
