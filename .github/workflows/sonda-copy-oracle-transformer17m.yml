name: Sonda Copy Oracle Transformer 17M

on:
  pull_request:
    paths:
      - 'experimentos/sonda_copy_oracle_transformer17m_20261011/**'
      - '.github/workflows/sonda-copy-oracle-transformer17m.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sonda-copy-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compilar sonda e confirmar holdout congelado
        run: |
          python -m py_compile experimentos/sonda_copy_oracle_transformer17m_20261011/sondar.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('experimentos/auditoria_transformer_17m_v4_v5_20261011/manifesto_holdout.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          assert m['holdout_sha256_canonico']=='55fab7f65ded87c721fe44bf84d6b69a1153c32caa3675feb95ce1a7887707f0'
          assert m['congelado_antes_da_avaliacao'] is True
          print('holdout diagnóstico preservado',m['holdout_sha256_canonico'])
          PY
      - name: Instalar runtime de avaliação
        run: |
          python -m pip install 'numpy>=1.24,<3' 'tokenizers>=0.20,<1'
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Baixar V4 congelada
        uses: actions/download-artifact@v4
        with:
          name: escola-transformer-17m-binding-bridge-v4
          path: /tmp/crivo-v4
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38154299065
      - name: Baixar V5 congelada
        uses: actions/download-artifact@v4
        with:
          name: escola-transformer-17m-midbridge-v5
          path: /tmp/crivo-v5
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38160159893
      - name: Verificar identidade e inatividade
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v4=json.loads(Path('/tmp/crivo-v4/meta.json').read_text(encoding='utf-8'))
          v5=json.loads(Path('/tmp/crivo-v5/meta.json').read_text(encoding='utf-8'))
          assert v4['checkpoint_composto_sha256']=='c53981fda15f31fcc22b3355a8eb75551ce85907926960c1776774db0d9f2cda'
          assert v5['checkpoint_composto_sha256']=='03a0bdc2241d01029df2ff34e2dc2aace1209bf90e6303ce50c9bb9b41758a89'
          assert v4['ativo_no_chat'] is False and v5['ativo_no_chat'] is False
          print('V4/V5 congeladas e inativas')
          PY
      - name: Executar copy-oracle sem treino
        run: |
          python experimentos/sonda_copy_oracle_transformer17m_20261011/sondar.py \
            --v4 /tmp/crivo-v4 --v5 /tmp/crivo-v5 \
            --saida /tmp/sonda-copy-oracle --dispositivo cpu
      - name: Publicar relatório diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: sonda-copy-oracle-transformer17m
          path: /tmp/sonda-copy-oracle
          retention-days: 7
          if-no-files-found: error
