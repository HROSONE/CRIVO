name: Escola Transformer 17M V1 (concluída)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contratos-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Revalidar contratos históricos da V1
        run: |
          python -m py_compile \
            experimentos/escola_transformer_17m_20261011/preparar_holdout.py \
            experimentos/escola_transformer_17m_20261011/curriculo.py \
            experimentos/escola_transformer_17m_20261011/treinar_escola.py \
            experimentos/escola_transformer_17m_20261011/treinar_repo.py \
            testes_escola_transformer_17m.py
          python -m unittest testes_escola_transformer_17m -v
