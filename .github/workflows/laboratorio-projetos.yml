name: Laboratório de projetos JS e TS
on:
  pull_request:
  workflow_run:
    workflows: ["Treino nativo JS e TS com código real"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_candidato:
        description: 'Run do treino com artefato crivo-codigo-real-ID; vazio confere só referências'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  laboratorio:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - run: npm install --prefix /tmp/ts typescript@5.9.3
      - name: Testar referências, reparo e isolamento real
        env:
          CRIVO_LAB_NODE: '1'
          CRIVO_TSC: /tmp/ts/node_modules/typescript/lib/tsc.js
        run: |
          python -m unittest testes_laboratorio_projetos -v
          python scripts/avaliar_projetos.py --referencias --tsc "$CRIVO_TSC" --saida /tmp/laboratorio/referencias.json
      - name: Validar ID da execução
        if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.run_candidato != '')
        env:
          RUN_ID: ${{ inputs.run_candidato || github.event.workflow_run.id }}
        run: python -c 'import os; assert os.environ["RUN_ID"].isdigit(), "Run deve ser um ID numérico"'
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.run_candidato != '')
        with:
          name: crivo-codigo-real-${{ inputs.run_candidato || github.event.workflow_run.id }}
          run-id: ${{ inputs.run_candidato || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/candidato
      - name: Instalar inferência CPU
        if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.run_candidato != '')
        run: |
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'tokenizers>=0.20,<1' 'numpy>=1.24,<3'
      - name: Avaliar candidato sem treinar ou ativar
        if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.run_candidato != '')
        run: python scripts/avaliar_projetos.py --modelo /tmp/candidato/candidato/melhor --tsc /tmp/ts/node_modules/typescript/lib/tsc.js --reparos 2 --saida /tmp/laboratorio/candidato.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laboratorio-projetos-${{ github.run_id }}
          path: /tmp/laboratorio
          retention-days: 30
