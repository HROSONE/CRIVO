name: Preservar treinos antigos antes da limpeza
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: backup-actions-20261009
  cancel-in-progress: false
jobs:
  preservar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Arquivar no mesmo GitHub e conferir SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/arquivar_artefatos_actions.py
