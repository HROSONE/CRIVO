name: Auditoria de regras mistas
on:
  pull_request:
    paths:
      - 'raciocinio.py'
      - 'interpretacao_geral.py'
      - 'analisador_portugues.py'
      - 'referencias_dialogo.py'
      - 'testes_referencias_dialogo.py'
      - 'testes_analisador_portugues.py'
      - 'testes_interpretacao_geral.py'
      - 'relacoes.json'
      - 'testes_regras_mistas.py'
      - 'avaliar_regras_mistas.py'
      - 'coorte_geral_v04.json'
      - 'coorte_geral.py'
      - 'conhecimento.json'
      - 'crivo.py'
      - 'conversa_assistente.py'
      - 'testes_autoconversa.py'
      - 'testes_conversa_informal.py'
      - 'interpretacao_pedidos.py'
      - 'testes_interpretacao_pedidos.py'
      - 'composicao_textual.py'
      - 'conhecimento_expandido.json'
      - 'testes_composicao_textual.py'
      - '.github/workflows/auditoria-regras.yml'
  workflow_dispatch:
jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testar regras e limites do grafo
        run: python -m unittest testes_raciocinio testes_regras_mistas testes_interpretacao_geral -v
      - name: Comparar avaliacao geral com grafo realmente carregado
        run: |
          set -o pipefail
          python avaliar_regras_mistas.py | tee benchmark-regras-mistas.json
      - name: Publicar relatorio (inclusive ao encontrar regressoes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-regras-mistas
          path: benchmark-regras-mistas.json
