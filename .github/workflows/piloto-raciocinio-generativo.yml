name: Contratos do piloto de raciocínio generativo
concurrency:
  group: dominio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    paths:
      - 'experimentos/raciocinio_generativo/**'
      - 'raciocinio_ativo.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contratos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dados separados e veto sem resposta simbólica oculta
        env:
          PYTHONPATH: experimentos/raciocinio_generativo
        run: python -S -m unittest testes_piloto testes_modular -v
