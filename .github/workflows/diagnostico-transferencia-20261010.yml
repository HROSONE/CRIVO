name: Diagnostico transferencia 2026-10-10

on:
  push:
    branches:
      - codex/diagnostico-transferencia-20261010
    paths:
      - 'experimentos/diagnostico_transferencia_20261010/executar.py'
      - 'experimentos/diagnostico_transferencia_20261010/aprofundar_resultados.py'
      - 'experimentos/diagnostico_transferencia_20261010/protocolo.json'
      - '.github/workflows/diagnostico-transferencia-20261010.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ambiente numerico
        run: python -m pip install 'numpy==2.3.5'
      - name: Compilar diagnóstico
        run: |
          python -m py_compile experimentos/diagnostico_transferencia_20261010/executar.py
          python -m py_compile experimentos/diagnostico_transferencia_20261010/aprofundar_resultados.py
      - name: Executar diagnóstico congelado
        run: |
          python experimentos/diagnostico_transferencia_20261010/executar.py
          python experimentos/diagnostico_transferencia_20261010/aprofundar_resultados.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-transferencia-20261010
          path: |
            experimentos/diagnostico_transferencia_20261010/resultados.json
            experimentos/diagnostico_transferencia_20261010/RELATORIO.md
            experimentos/diagnostico_transferencia_20261010/aprofundamento.json
            experimentos/diagnostico_transferencia_20261010/APROFUNDAMENTO.md
          if-no-files-found: warn
      - name: Preservar resultados na branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            experimentos/diagnostico_transferencia_20261010/resultados.json \
            experimentos/diagnostico_transferencia_20261010/RELATORIO.md \
            experimentos/diagnostico_transferencia_20261010/aprofundamento.json \
            experimentos/diagnostico_transferencia_20261010/APROFUNDAMENTO.md
          if git diff --cached --quiet; then
            echo 'Sem novos resultados para registrar.'
          else
            git commit -m 'Registra aprofundamento do diagnostico de transferencia'
            git push
          fi
