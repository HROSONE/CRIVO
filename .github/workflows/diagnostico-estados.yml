name: Diagnóstico e reparos próprios
on:
  pull_request:
    paths:
      - 'diagnostico_estados.py'
      - 'execucao_rastreada.py'
      - 'rede_reparos.py'
      - 'scripts/diagnosticar_estados.py'
      - 'scripts/experimento_diagnostico.py'
      - 'testes_diagnostico_estados.py'
      - 'dados/estados/benchmark-diagnostico.json'
      - 'dados/estados/v3-congelada.json'
      - 'exemplos/diagnostico-incremento.json'
      - '.github/workflows/diagnostico-estados.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experimento:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - run: python -m pip install 'numpy>=1.24,<3' 'quickjs==1.19.4'
      - run: npm install --prefix /tmp/ts typescript@5.9.3
      - name: Diagnóstico, isolamento, gradientes e regressões
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest testes_diagnostico_estados testes_rede_precisa testes_estados_estruturas testes_interpretacao_estados -v
      - name: Treinar ranking do zero e comparar buscas em três sementes
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python scripts/experimento_diagnostico.py --saida /tmp/diagnostico --tsc /tmp/ts/node_modules/typescript/lib/tsc.js
      - name: Exemplo de diagnóstico sem rede
        run: python scripts/diagnosticar_estados.py --contrato exemplos/diagnostico-incremento.json > /tmp/diagnostico/exemplo.json
      - name: Resumo e limites
        if: always()
        run: test ! -f /tmp/diagnostico/resumo.md || cat /tmp/diagnostico/resumo.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-estados-${{ github.run_id }}
          path: /tmp/diagnostico
          retention-days: 30
