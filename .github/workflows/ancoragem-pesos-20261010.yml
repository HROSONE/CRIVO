name: Ancoragem pesos 2026-10-10

on:
  push:
    branches:
      - codex/ancoragem-pesos-20261010
    paths:
      - 'experimentos/ancoragem_pesos_20261010/executar.py'
      - 'experimentos/ancoragem_pesos_20261010/protocolo.json'
      - '.github/workflows/ancoragem-pesos-20261010.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ancoragem:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ambiente numerico
        run: python -m pip install 'numpy==2.3.5'
      - name: Compilar experimento
        run: python -m py_compile experimentos/ancoragem_pesos_20261010/executar.py
      - name: Executar ancoragem congelada
        run: python experimentos/ancoragem_pesos_20261010/executar.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ancoragem-pesos-20261010
          path: |
            experimentos/ancoragem_pesos_20261010/resultados.json
            experimentos/ancoragem_pesos_20261010/RELATORIO.md
            experimentos/ancoragem_pesos_20261010/checkpoint_ancorado.json.gz
          if-no-files-found: warn
      - name: Preservar resultados na branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            experimentos/ancoragem_pesos_20261010/resultados.json \
            experimentos/ancoragem_pesos_20261010/RELATORIO.md \
            experimentos/ancoragem_pesos_20261010/checkpoint_ancorado.json.gz
          if git diff --cached --quiet; then
            echo 'Sem novos resultados para registrar.'
          else
            git commit -m 'Registra resultado da ancoragem de pesos'
            git push
          fi
