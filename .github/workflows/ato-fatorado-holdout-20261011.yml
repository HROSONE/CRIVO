name: Ato fatorado - congelar holdout 2026-10-11
on:
  push:
    branches: [codex/ato-fatorado-dialogo-20261011]
    paths:
      - 'experimentos/ato_fatorado_dialogo_20261011/protocolo.json'
      - 'experimentos/ato_fatorado_dialogo_20261011/preparar_holdout.py'
      - '.github/workflows/ato-fatorado-holdout-20261011.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  congelar:
    runs-on: ubuntu-22.04
    env: {OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1', PYTHONHASHSEED: '0'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy==2.3.5'
      - run: python -m py_compile experimentos/ato_fatorado_dialogo_20261011/preparar_holdout.py
      - run: python experimentos/ato_fatorado_dialogo_20261011/preparar_holdout.py
      - name: Gravar holdout
        run: |
          git config user.name 'Henry Tools'
          git config user.email 'zerobob623@gmail.com'
          git add experimentos/ato_fatorado_dialogo_20261011/holdout_novo.json experimentos/ato_fatorado_dialogo_20261011/manifesto_holdout.json
          git diff --cached --quiet || (git commit -m 'Congela holdout prospectivo fatorado' && git push)
