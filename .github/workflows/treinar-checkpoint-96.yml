name: Treinar checkpoint experimental 96
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'conhecimento*.json'
      - 'rede_neural.py'
      - 'scripts/treinar_astronomia.py'
      - '.github/workflows/treinar-checkpoint-96.yml'
jobs:
  treino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Treinar 100 epocas e salvar pesos
        run: python scripts/treinar_astronomia.py --epocas 100 --saida rede_astronomia_experimental.json
      - name: Publicar pesos treinados
        uses: actions/upload-artifact@v4
        with:
          name: crivo-pesos-96
          path: rede_astronomia_experimental.json
          if-no-files-found: error
