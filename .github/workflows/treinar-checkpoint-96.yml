name: Treinar checkpoint experimental 96
concurrency:
  group: dominio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'conhecimento*.json'
      - 'rede_neural.py'
      - 'scripts/treinar_astronomia.py'
      - 'scripts/avaliar_astronomia_independente.py'
      - 'testes_avaliador_checkpoint_experimental.py'
jobs:
  treino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3'
      - name: Treinar 100 epocas e salvar pesos
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python scripts/treinar_astronomia.py --epocas 100 --saida rede_astronomia_experimental.json --numpy
      - name: Avaliar checkpoint de 96 neuronios em prova retida
        run: |
          python scripts/avaliar_astronomia_independente.py --modelo rede_astronomia_experimental.json --relatorio resultado_astronomia_experimental_96.json || echo 'Prova abaixo do gate ou falhou; consultar relatorio e logs; nao promover pesos.'
      - name: Publicar relatorio experimental
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crivo-avaliacao-96
          path: resultado_astronomia_experimental_96.json
          if-no-files-found: warn
      - name: Publicar pesos treinados
        uses: actions/upload-artifact@v4
        with:
          name: crivo-pesos-96
          path: rede_astronomia_experimental.json
          if-no-files-found: error
