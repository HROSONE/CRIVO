name: Continuidade e escopos do diálogo
on:
  pull_request:
    paths:
      - 'crivo.py'
      - 'dialogo_situado.py'
      - 'memoria_sessao.py'
      - 'testes_memoria_sessao.py'
      - 'testes_memoria_parafrases.py'
      - 'experimentos/memoria_sessao_20261009/**'
      - 'experimentos/memoria_prospectiva_20261009/**'
      - 'raciocinio_conversa.py'
      - 'argumentos_conversa.py'
      - 'web_core.py'
      - 'ecossistema.py'
      - 'testes_raciocinio_conversa.py'
      - 'testes_hipoteses_confirmadas.py'
      - 'testes_argumentos_conversa.py'
      - 'experimentos/raciocinio_conversa_20261008/**'
      - 'experimentos/confirmacao_hipoteses_20261009/**'
      - 'dialogo_aberto.py'
      - 'geracao_conversa.py'
      - 'pedidos_gerativos.py'
      - 'linguagem_conversa.py'
      - 'compreensao_intencao.py'
      - 'testes_dialogo_situado.py'
      - 'avaliar_dialogo_real.py'
      - 'experimentos/dialogo_situado_20261008/**'
      - '.github/workflows/dialogo-situado.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dialogo:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3'
      - name: Escopos, memória e compatibilidade sem dependências opcionais
        run: |
          python -m unittest testes_dialogo_situado -v
          python -m unittest testes_memoria_sessao -v
          python -S -m unittest testes_memoria_parafrases -v
          python -S -m unittest testes_memoria_sessao.TestesMemoriaSessao -v
          python -S -m unittest testes_dialogo_situado.TestesQuadroSituado -v
          python -m unittest testes_raciocinio_conversa -v
          python -m unittest testes_hipoteses_confirmadas -v
          python -m unittest testes_argumentos_conversa -v
          python -S -m unittest testes_raciocinio_conversa.TestesRaciocinioConversa -v
          python -S -m unittest testes_hipoteses_confirmadas.TestesHipotesesConfirmadas -v
          python -S -m unittest testes_argumentos_conversa.TestesArgumentosConversa -v
      - name: Sonda pública original e desenvolvimento adicional
        run: |
          python avaliar_dialogo_real.py --saida /tmp/dialogo-original.json
          python experimentos/memoria_sessao_20261009/avaliar.py --exigir-meta --saida /tmp/dialogo-memoria-sessao.json
          python experimentos/memoria_prospectiva_20261009/avaliar.py --exigir-meta --saida /tmp/dialogo-memoria-prospectiva.json
          python experimentos/dialogo_situado_20261008/avaliar.py desenvolvimento --exigir-todos --saida /tmp/dialogo-desenvolvimento.json
          python experimentos/confirmacao_hipoteses_20261009/avaliar.py --raiz . --modo motor --exigir-todos --saida /tmp/dialogo-hipoteses-motor.json
          python experimentos/confirmacao_hipoteses_20261009/avaliar.py --raiz . --modo web --exigir-todos --saida /tmp/dialogo-hipoteses-web.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: respostas-dialogo-situado
          path: /tmp/dialogo-*.json
