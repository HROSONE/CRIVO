name: Treinar candidata astronomia CRIVO
on:
  workflow_dispatch:
  push:
    branches:
      - exp/conhecimento-astronomia-basica-20261001
    paths:
      - .github/workflows/treinar-astronomia.yml
      - scripts/treinar_especializacao_astronomia.py

permissions:
  contents: write

jobs:
  treinamento:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar seguranca minima e proveniencia antes do treino candidato
        run: |
          python crivo.py --teste
          python -m unittest             testes_astronomia_editorial.TestesAstronomiaEditorial.test_conceitos_e_proveniencia             testes_astronomia_editorial.TestesAstronomiaEditorial.test_formacao_e_mecanismos_documentados             testes_astronomia_editorial.TestesAstronomiaEditorial.test_primeiro_modulo_requer_limites_para_todos_os_termos             -q
          python -m unittest testes_astronomia_sistema_solar -q
      # O experimento neural pode gerar metricas e pesos candidatos mesmo que
      # o CI completo da PR continue vermelho. Isto NAO autoriza merge/deploy.
      - name: Treinar classificador proprio e avaliar respostas
        run: python scripts/treinar_especializacao_astronomia.py
      - name: Publicar somente artefatos candidatos, sem fazer deploy
        uses: actions/upload-artifact@v4
        with:
          name: candidato-astronomia-${{ github.run_number }}
          path: |
            rede_crivo.json
            avaliacao_treino_astronomia.json
          retention-days: 14
          if-no-files-found: error

      - name: Validar assinaturas e qualidade do checkpoint candidato
        run: |
          python - <<'PY'
          import json
          from crivo import Crivo
          from rede_neural import RedeCrivo
          bot = Crivo()
          rede = RedeCrivo.carregar("rede_crivo.json")
          dados = json.load(open("avaliacao_treino_astronomia.json", encoding="utf-8"))
          assert bot.rede is not None and bot.erro_rede is None, bot.erro_rede
          assert set(rede.rotulos) == {x["id"] for x in bot.base}
          a = dados["astronomia"]
          assert a["classificador"]["acertos"] * 4 >= a["classificador"]["total"] * 3, a
          assert a["hibrido"]["acertos"] * 10 >= a["hibrido"]["total"] * 9, a
          assert all(c["absteve"] for c in dados["controles_desconhecidos"]), dados
          print("Checkpoint compativel com base e provas candidatas: OK")
          PY
      - name: Repetir as quatro regressões com a nova rede realmente ativa
        run: |
          python -m unittest \
            testes_conhecimento_mundo.TestesConhecimentoMundo.test_relacoes_nao_descartam_negacao_qualificadores_ou_direcao \
            testes_linguagem_conversa.TestesLinguagemConversa.test_reformulacoes_sucessivas_sao_variadas_e_deterministicas \
            testes_semantica_programacao.TestesSemanticaProgramacao.test_conhecimento_novo_resolve_ambiguidade_antiga_com_prova \
            testes_web.TestesWebCore.test_reconstroi_contexto_em_vez_de_salvar_no_servidor \
            -v
      - name: Integrar checkpoint validado somente na branch de astronomia
        if: "github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci: publicar checkpoint astronomia')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo "A branch mudou enquanto o treino rodava; nunca enviar pesos de uma base antiga."
            exit 1
          }
          git add rede_crivo.json
          git diff --cached --quiet && exit 0
          git commit -m "train: publicar checkpoint compatível de astronomia na branch candidata"
          git push origin "HEAD:$GITHUB_REF_NAME"
