name: Treinar candidata astronomia CRIVO
on:
  workflow_dispatch:
  push:
    branches:
      - exp/conhecimento-astronomia-basica-20261001
    paths:
      - .github/workflows/treinar-astronomia.yml
      - scripts/treinar_especializacao_astronomia.py

permissions:
  contents: read

jobs:
  treinamento:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar seguranca minima e proveniencia antes do treino candidato
        run: |
          python crivo.py --teste
          python -m unittest             testes_astronomia_editorial.TestesAstronomiaEditorial.test_conceitos_e_proveniencia             testes_astronomia_editorial.TestesAstronomiaEditorial.test_formacao_e_mecanismos_documentados             testes_astronomia_editorial.TestesAstronomiaEditorial.test_primeiro_modulo_requer_limites_para_todos_os_termos             -q
          python -m unittest testes_astronomia_sistema_solar -q
      # O experimento neural pode gerar metricas e pesos candidatos mesmo que
      # o CI completo da PR continue vermelho. Isto NAO autoriza merge/deploy.
      - name: Treinar classificador proprio e avaliar respostas
        run: python scripts/treinar_especializacao_astronomia.py
      - name: Publicar somente artefatos candidatos, sem fazer deploy
        uses: actions/upload-artifact@v4
        with:
          name: candidato-astronomia-${{ github.run_number }}
          path: |
            rede_crivo.json
            avaliacao_treino_astronomia.json
          retention-days: 14
          if-no-files-found: error
