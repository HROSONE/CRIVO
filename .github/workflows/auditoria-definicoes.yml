name: Auditoria de definicoes
on:
  pull_request:
    paths:
      - 'crivo.py'
      - 'composicao_textual.py'
      - 'conhecimento_expandido.json'
      - 'testes_composicao_textual.py'
      - 'interpretacao_geral.py'
      - 'analisador_portugues.py'
      - 'referencias_dialogo.py'
      - 'testes_referencias_dialogo.py'
      - 'testes_analisador_portugues.py'
      - 'testes_interpretacao_geral.py'
      - 'conhecimento.json'
      - 'avaliar_definicoes.py'
      - 'coorte_geral.py'
      - 'coorte_geral_v04.json'
      - 'testes_intencao_definicao.py'
      # Consultas estruturadas sobre frutas podem interceptar definições gerais.
      - 'frutas.py'
      - 'frutas.json'
      - 'testes_relacoes_frutas.py'
      - '.github/workflows/auditoria-definicoes.yml'
  workflow_dispatch:
jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Conferir perguntas definicionais e negativas
        run: python -m unittest testes_intencao_definicao -v
      - name: Comparar coorte historica e curriculo ampliado com e sem grafo
        run: |
          set -o pipefail
          python avaliar_definicoes.py | tee relatorio-definicoes.json
      - name: Publicar relatorio mesmo em caso de regressao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-definicoes
          path: relatorio-definicoes.json
