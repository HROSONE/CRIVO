<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRIVO</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0B0A1F; color: #E9E5FF; font-family: system-ui, sans-serif; text-align: center; padding: 0 16px; }
  .rosto { width: 88px; height: 88px; border-radius: 50%; background: #8B5CF6; margin: 0 auto 24px; position: relative;
           animation: pulsa 1.6s ease-in-out infinite; }
  .rosto::before, .rosto::after { content: ""; position: absolute; top: 30px; width: 16px; height: 16px; border-radius: 50%;
           background: #fff; box-shadow: inset 0 0 0 5px #fff, inset 3px 3px 0 8px #1E1B4B; }
  .rosto::before { left: 22px; } .rosto::after { right: 22px; }
  p { color: #B9B2E6; max-width: 32ch; margin: 8px auto; line-height: 1.5; }
  @keyframes pulsa { 50% { transform: scale(1.06); } }
</style>
</head>
<body>
<main>
  <div class="rosto" aria-hidden="true"></div>
  <h1>Preparando o CRIVO…</h1>
  <p id="msg">Na primeira vez ele copia os pesos para o aparelho. Pode levar até um minuto.</p>
  <p>Tudo roda aqui no celular, sem internet.</p>
</main>
</body>
</html>
